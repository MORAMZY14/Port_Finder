name: porty
description: "MSAN Lookup Tool with built-in Excel data"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Excel handling
  file_picker: ^8.0.0
  excel: ^2.1.0

  # Local storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Hive code generation (optional, used only if you switch to codegen)
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets (bundled Excel file)
  assets:
    - assets/msan_data.xlsx